<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="100%" height="100%">
  <!-- House Mark -->
  <g id="house-icon" stroke="#1B2A4A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Roof with overhangs -->
    <path d="M 24 82 L 85 26 L 146 82" />
    
    <!-- House body walls & baseline -->
    <path d="M 37 70 L 37 134 L 133 134 L 133 70" />
    
    <!-- Door -->
    <path d="M 70 134 L 70 94 L 100 94 L 100 134" />
    
    <!-- Left Window (Warm gold filled square) -->
    <rect x="49" y="84" width="13" height="13" fill="#BA854D" stroke="none" />
    
    <!-- Right Window (Warm gold filled square) -->
    <rect x="108" y="84" width="13" height="13" fill="#BA854D" stroke="none" />
  </g>

  <!-- Typography: Rent With You -->
  <text
    x="180"
    y="78"
    fill="#1B2A4A"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="48"
    font-weight="700"
    letter-spacing="-0.5"
  >Rent With You</text>

  <!-- Golden Divider Line -->
  <line
    x1="180"
    y1="98"
    x2="530"
    y2="98"
    stroke="#BA854D"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Subtitle: A HOME, WITH YOU -->
  <text
    x="182"
    y="122"
    fill="#5C6672"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="12.5"
    font-weight="600"
    letter-spacing="0.38em"
  >A HOME, WITH YOU</text>
</svg>
