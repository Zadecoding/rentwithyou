<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Tile Background for Perfect Visibility in Both Light and Dark Browser Tabs -->
  <rect width="64" height="64" rx="14" fill="#F8F6F0" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#E8E2D5" stroke-width="1" />

  <!-- House Icon matching Brand Logo -->
  <g stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Roof with overhangs -->
    <path d="M 10 33 L 32 12 L 54 33" />
    
    <!-- House walls and foundation -->
    <path d="M 15 28 L 15 52 L 49 52 L 49 28" />
    
    <!-- Door -->
    <path d="M 27 52 L 27 37 L 37 37 L 37 52" />
    
    <!-- Left Window (Warm Gold) -->
    <rect x="19" y="33" width="5.5" height="5.5" fill="#BA854D" stroke="none" />
    
    <!-- Right Window (Warm Gold) -->
    <rect x="39.5" y="33" width="5.5" height="5.5" fill="#BA854D" stroke="none" />
  </g>
</svg>
